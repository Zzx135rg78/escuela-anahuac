version: "3.9"

services:
  anahuac-gallery:
    build: .
    container_name: anahuac-gallery
    restart: always
    expose:
      - "8000"
    volumes:
      - ./photos:/app/photos
      - ./instance:/app/instance
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-cambiar_por_una_clave_segura}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-escuelaanahuac}
      - DATABASE_URL=sqlite:////app/instance/gallery.db
      # Opcional: Cloudinary (Render / producción)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - anahuac-gallery

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot;
               sleep 12h & wait $!;
             done"